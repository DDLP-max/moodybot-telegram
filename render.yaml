# MoodyBot Telegram on Render — webhook transport (no getUpdates).
# type: web so Render exposes HTTPS for Telegram callbacks.
# TELEGRAM_MODE=webhook is required in production.
services:
  - type: web
    name: moodybot-telegram
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python build_system_prompt.py
    startCommand: python moodybot.py
    healthCheckPath: /health
    # Dedup and the daily model cap live in SQLite. Render drops the
    # instance filesystem on restart, so that file has to sit on this disk.
    disk:
      name: moodybot-x-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_BASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # X Activity API. Values live in the Render dashboard, not in git.
      # X_REPLIES_ENABLED stays false until a dry run of /api/x/webhook succeeds.
      - key: X_OAUTH2_CLIENT_SECRET
        sync: false
      - key: X_OAUTH2_CLIENT_ID
        sync: false
      - key: X_OAUTH2_REFRESH_TOKEN
        sync: false
      - key: X_OAUTH1_CONSUMER_SECRET
        sync: false
      # Public id of @MoodyBotAI. Polling reads this account's mentions.
      - key: X_BOT_USER_ID
        value: "1912252811469025282"
      - key: X_USER_ACCESS_TOKEN
        sync: false
      - key: X_REPLIES_ENABLED
        value: "false"
      - key: X_DAILY_MODEL_CALL_LIMIT
        value: "25"
      - key: X_STATE_DIR
        value: /var/data/x
      # One observation pass runs while replies stay off. The loop does not
      # publish until X_REPLIES_ENABLED is turned on after that pass.
      - key: X_POLL_ENABLED
        value: "true"
      - key: X_POLL_INTERVAL_SECONDS
        value: "300"
