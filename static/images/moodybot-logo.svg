<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#2C3E50" />
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#E74C3C" stroke-width="5" />
  
  <!-- Moody face -->
  <g transform="translate(100, 100)">
    <!-- Eyes - slightly slanted for that Moody look -->
    <ellipse cx="-30" cy="-15" rx="12" ry="8" fill="#ECF0F1" />
    <ellipse cx="30" cy="-15" rx="12" ry="8" fill="#ECF0F1" />
    
    <!-- Pupils - looking slightly to the side -->
    <circle cx="-27" cy="-15" r="5" fill="#2C3E50" />
    <circle cx="33" cy="-15" r="5" fill="#2C3E50" />
    
    <!-- Eyebrows - angled for skeptical look -->
    <path d="M-45,-25 L-15,-30" stroke="#ECF0F1" stroke-width="4" stroke-linecap="round" />
    <path d="M45,-25 L15,-30" stroke="#ECF0F1" stroke-width="4" stroke-linecap="round" />
    
    <!-- Mouth - slight smirk -->
    <path d="M-30,30 C-20,40 20,40 30,25" stroke="#ECF0F1" stroke-width="4" fill="none" stroke-linecap="round" />
    
    <!-- Stubble represented as small dots -->
    <g fill="#95A5A6">
      <circle cx="-40" cy="30" r="1.5" />
      <circle cx="-35" cy="35" r="1.5" />
      <circle cx="-30" cy="40" r="1.5" />
      <circle cx="-25" cy="42" r="1.5" />
      <circle cx="-20" cy="43" r="1.5" />
      <circle cx="-15" cy="44" r="1.5" />
      <circle cx="-10" cy="45" r="1.5" />
      <circle cx="-5" cy="45" r="1.5" />
      <circle cx="0" cy="45" r="1.5" />
      <circle cx="5" cy="45" r="1.5" />
      <circle cx="10" cy="44" r="1.5" />
      <circle cx="15" cy="43" r="1.5" />
      <circle cx="20" cy="42" r="1.5" />
      <circle cx="25" cy="40" r="1.5" />
      <circle cx="30" cy="38" r="1.5" />
      <circle cx="35" cy="35" r="1.5" />
      <circle cx="40" cy="30" r="1.5" />
      <!-- Cheek stubble -->
      <circle cx="-45" cy="10" r="1.5" />
      <circle cx="-47" cy="15" r="1.5" />
      <circle cx="-48" cy="20" r="1.5" />
      <circle cx="45" cy="10" r="1.5" />
      <circle cx="47" cy="15" r="1.5" />
      <circle cx="48" cy="20" r="1.5" />
    </g>
  </g>
  
  <!-- Text "MoodyBot" at the bottom -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ECF0F1" text-anchor="middle">MoodyBot</text>
</svg>