<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodyBot - Statistics</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">MoodyBot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('stats_page') }}">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="mb-4">MoodyBot Statistics</h1>
        
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card bg-dark">
                    <div class="card-body">
                        <h5 class="card-title">Total Users</h5>
                        <div class="d-flex align-items-center">
                            <h2 class="mb-0" id="total-users">--</h2>
                            <small class="ms-2 text-muted">users</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-dark">
                    <div class="card-body">
                        <h5 class="card-title">Total Messages</h5>
                        <div class="d-flex align-items-center">
                            <h2 class="mb-0" id="total-messages">--</h2>
                            <small class="ms-2 text-muted">messages</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-dark">
                    <div class="card-body">
                        <h5 class="card-title">Total Conversations</h5>
                        <div class="d-flex align-items-center">
                            <h2 class="mb-0" id="total-conversations">--</h2>
                            <small class="ms-2 text-muted">threads</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card bg-dark">
                    <div class="card-header">
                        <h5 class="mb-0">Daily Message Volume</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="message-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card bg-dark">
                    <div class="card-header">
                        <h5 class="mb-0">Average Response Time</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="response-time-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12 mb-4">
                <div class="card bg-dark">
                    <div class="card-header">
                        <h5 class="mb-0">User Activity Over Time</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="user-activity-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12 mb-4">
                <div class="card bg-dark">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Recent Activity</h5>
                            <button class="btn btn-sm btn-primary" id="refresh-button">Refresh</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Messages</th>
                                        <th>Users</th>
                                        <th>Avg. Response Time</th>
                                    </tr>
                                </thead>
                                <tbody id="activity-table-body">
                                    <tr>
                                        <td colspan="4" class="text-center">Loading data...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Charts configuration
            let messageChart, responseTimeChart, userActivityChart;
            
            // Function to initialize charts
            function initCharts() {
                // Message volume chart
                const messageCtx = document.getElementById('message-chart').getContext('2d');
                messageChart = new Chart(messageCtx, {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Messages',
                            data: [],
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        },
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
                
                // Response time chart
                const responseTimeCtx = document.getElementById('response-time-chart').getContext('2d');
                responseTimeChart = new Chart(responseTimeCtx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Response Time (seconds)',
                            data: [],
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 2,
                            tension: 0.1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        },
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
                
                // User activity chart
                const userActivityCtx = document.getElementById('user-activity-chart').getContext('2d');
                userActivityChart = new Chart(userActivityCtx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Daily Active Users',
                            data: [],
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 2,
                            tension: 0.1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        },
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
            }
            
            // Fetch statistics data
            async function fetchStatistics() {
                try {
                    const response = await fetch('/api/statistics/history');
                    if (!response.ok) {
                        throw new Error('Failed to fetch statistics');
                    }
                    
                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('Error fetching statistics:', error);
                    return { status: 'error', message: error.message };
                }
            }
            
            // Fetch summary statistics
            async function fetchSummary() {
                try {
                    const response = await fetch('/statistics');
                    if (!response.ok) {
                        throw new Error('Failed to fetch summary');
                    }
                    
                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('Error fetching summary:', error);
                    return { status: 'error', message: error.message };
                }
            }
            
            // Update summary section
            function updateSummary(data) {
                if (data.status === 'success') {
                    document.getElementById('total-users').textContent = data.data.total_users || 0;
                    document.getElementById('total-messages').textContent = data.data.total_messages || 0;
                    document.getElementById('total-conversations').textContent = data.data.total_conversations || 0;
                }
            }
            
            // Update charts with statistics data
            function updateCharts(data) {
                if (data.status === 'success' && data.data && data.data.length > 0) {
                    // Format data for charts
                    const dates = data.data.map(item => item.date);
                    const messageCounts = data.data.map(item => item.message_count);
                    const responseTimes = data.data.map(item => item.response_time_avg);
                    const userCounts = data.data.map(item => item.user_count);
                    
                    // Update message chart
                    messageChart.data.labels = dates;
                    messageChart.data.datasets[0].data = messageCounts;
                    messageChart.update();
                    
                    // Update response time chart
                    responseTimeChart.data.labels = dates;
                    responseTimeChart.data.datasets[0].data = responseTimes;
                    responseTimeChart.update();
                    
                    // Update user activity chart
                    userActivityChart.data.labels = dates;
                    userActivityChart.data.datasets[0].data = userCounts;
                    userActivityChart.update();
                    
                    // Update activity table
                    updateActivityTable(data.data);
                }
            }
            
            // Update activity table
            function updateActivityTable(data) {
                const tableBody = document.getElementById('activity-table-body');
                tableBody.innerHTML = '';
                
                if (data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center">No data available</td>
                        </tr>
                    `;
                    return;
                }
                
                // Sort data by date (newest first)
                data.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                // Take the 7 most recent records
                const recentData = data.slice(0, 7);
                
                recentData.forEach(item => {
                    const formattedTime = item.response_time_avg ? 
                        parseFloat(item.response_time_avg).toFixed(2) + ' s' : 'N/A';
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.date}</td>
                        <td>${item.message_count}</td>
                        <td>${item.user_count}</td>
                        <td>${formattedTime}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            
            // Initialize and load data
            async function initialize() {
                initCharts();
                
                // Load summary data
                const summaryData = await fetchSummary();
                updateSummary(summaryData);
                
                // Load history data
                try {
                    const historyData = await fetchStatistics();
                    updateCharts(historyData);
                } catch (error) {
                    console.error('Error loading history data:', error);
                    // If real data fails, fallback to empty dataset
                    updateCharts({
                        status: 'success',
                        data: []
                    });
                }
                
                // Set up refresh button
                document.getElementById('refresh-button').addEventListener('click', async function() {
                    const summaryData = await fetchSummary();
                    updateSummary(summaryData);
                    
                    try {
                        const historyData = await fetchStatistics();
                        updateCharts(historyData);
                    } catch (error) {
                        console.error('Error refreshing history data:', error);
                    }
                });
            }
            
            // Start initialization
            initialize();
        });
    </script>
</body>
</html>
